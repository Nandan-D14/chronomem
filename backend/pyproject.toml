[project]
name = "chronomem"
version = "0.1.0"
description = "Time-aware, contradiction-detecting agent memory on FalkorDB, exposed as an MCP plugin."
requires-python = ">=3.11"
dependencies = [
    "falkordb>=1.0.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=1.9,<2",
    "python-dotenv>=1.0",
]

[project.scripts]
chronomem-api = "chronomem.api:run"
chronomem-mcp = "chronomem.mcp_server:run"
chronomem-connect = "chronomem.connect:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chronomem"]
